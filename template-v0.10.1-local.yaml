        - Name: DJANGO_SETTINGS_MODULE
          Value: config.settings.local
        - Name: REDIS_HOST
          Value: localhost
        - Name: POSTGRES_HOST
          Value: localhost
        - Name: POSTGRES_PASSWORD
          Value: bastet
        - Name: POSTGRES_PORT
          Value: '5432'
        - Name: RABBITMQ_HOST
          Value: localhost
        - Name: POSTGRES_DB_NAME
          Value: bastet
        - Name: AIRFLOW_URL
          Value: !Sub "http://${AirflowLoadBalancer.DNSName}:8080"
        - Name: AIRFLOW_DAG_ID
          Value: file_polling
        - Name: AIRFLOW_USERNAME
          Value: !Ref AirflowUsername
        - Name: AIRFLOW_PASSWORD
          Value: !Ref AirflowPassword
        - Name: OTEL_EXPORTER_OTLP_ENDPOINT
          Value: !FindInMap [UI, OTEL-EXPORTER-OTLP-ENDPOINT, Value]
        MountPoints:
        - SourceVolume: !Sub "${AWS::StackName}_shared_temp"
          ContainerPath: /tmp/shared
          ReadOnly: false
        DependsOn:
        - ContainerName: bastet_web
          Condition: START
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet_celery_beat
        Image: !FindInMap [Images, WebContainerImage, ImageUri]
        Cpu: 0
        Essential: true
        Command:
        - celery
        - -A
        - config
        - beat
        - -l
        - info
        Environment:
        - Name: POSTGRES_USER
          Value: bastet
        - Name: DJANGO_SETTINGS_MODULE
          Value: config.settings.local
        - Name: REDIS_HOST
          Value: localhost
        - Name: POSTGRES_HOST
          Value: localhost
        - Name: POSTGRES_PASSWORD
          Value: bastet
        - Name: POSTGRES_PORT
          Value: '5432'
        - Name: RABBITMQ_HOST
          Value: localhost
        - Name: POSTGRES_DB_NAME
          Value: bastet
        - Name: AIRFLOW_URL
          Value: !Sub "http://${AirflowLoadBalancer.DNSName}:8080"
        - Name: AIRFLOW_DAG_ID
          Value: file_polling
        - Name: AIRFLOW_USERNAME
          Value: !Ref AirflowUsername
        - Name: AIRFLOW_PASSWORD
          Value: !Ref AirflowPassword
        - Name: OTEL_EXPORTER_OTLP_ENDPOINT
          Value: !FindInMap [UI, OTEL-EXPORTER-OTLP-ENDPOINT, Value]
        MountPoints:
        - SourceVolume: !Sub "${AWS::StackName}_shared_temp"
          ContainerPath: /tmp/shared
          ReadOnly: false
        DependsOn:
        - ContainerName: bastet_celery
          Condition: START
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet_nginx
        Image: !FindInMap [Images, NginxContainerImage, ImageUri]
        Cpu: 0
        PortMappings:
        - Name: bastet_nginx-80-tcp
          ContainerPort: 80
          HostPort: 80
          Protocol: tcp
        Essential: true
        MountPoints:
        - SourceVolume: static_volume
          ContainerPath: /home/app/web/staticfiles
          ReadOnly: false
        - SourceVolume: media_volume
          ContainerPath: /home/app/web/mediafiles
          ReadOnly: false
        DependsOn:
        - ContainerName: bastet_celery
          Condition: START
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet-opentelemetry
        Image: otel/opentelemetry-collector-contrib:0.122.0
        Cpu: 0
        PortMappings:
        - Name: otel-4317-grpc
          ContainerPort: 4317
          HostPort: 4317
          Protocol: tcp
        - Name: otel-4318-tcp
          ContainerPort: 4318
          HostPort: 4318
          Protocol: tcp
        Essential: false
        Command:
        - '--config'
        - '/code/otel_config/otel-collector-config.yaml'
        Environment:
        - Name: STACK_NAME
          Value: !Sub ${AWS::StackName}
        MountPoints:
        - SourceVolume: config_volume
          ContainerPath: /code/otel_config
        DependsOn:
        - ContainerName: bastet_web
          Condition: START
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
        HealthCheck:
          Command:
          - CMD
          - curl
          - --fail
          - http://localhost:13133/health
          Interval: 30
          Timeout: 10
          Retries: 5
          StartPeriod: 30
        SystemControls: []
        VolumesFrom: []
      Volumes:
      - Name: !Sub "${AWS::StackName}_ui_postgres_data"
        DockerVolumeConfiguration:
          Scope: shared
          Driver: rexray/ebs
          Autoprovision: true
          DriverOpts:
            size: '30'
            volumetype: gp2
      - Name: static_volume
        DockerVolumeConfiguration:
          Scope: task
          Driver: local
      - Name: media_volume
        DockerVolumeConfiguration:
          Scope: task
          Driver: local
      - Name: config_volume
        DockerVolumeConfiguration:
          Scope: task
          Driver: local
      - Name: !Sub "${AWS::StackName}_shared_temp"
        DockerVolumeConfiguration:
          Scope: shared
          Driver: rexray/ebs
          Autoprovision: true
          DriverOpts:
            size: '10'
            volumetype: gp2

  UIEcsService:
    Type: AWS::ECS::Service
    DependsOn:
    - UITaskDefinition
    - ClusterCPAssociation
    - ECSCluster
    Properties:
      ServiceName: !Sub ui-service-${ECSCluster}
      Cluster: !Ref ECSCluster
      TaskDefinition: !GetAtt UITaskDefinition.TaskDefinitionArn
      CapacityProviderStrategy:
      - CapacityProvider: !Ref UIEC2CapacityProvider
        Base: 0
        Weight: 1
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: '20'
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: false
      LoadBalancers:
      - ContainerName: bastet_nginx
        ContainerPort: 80
        TargetGroupArn: !GetAtt UITargetGroup.TargetGroupArn

  UILoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
    - UITargetGroup
    Properties:
      Name:
        Fn::Sub:
        - ${UILoadBalancerName}-${StackSuffix}
        - StackSuffix:
            Fn::Select:
            - 0
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - !Ref AWS::StackId
      Subnets:
      - !Ref PublicSubnet1
      - !Ref PublicSubnet2
      SecurityGroups:
      - !Ref SecurityGroup

  UITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Sub:
        - ${UILoadBalancerName}-${StackSuffix}
        - StackSuffix:
            Fn::Select:
            - 0
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - !Ref AWS::StackId
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthCheckPort: 80
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399
      TargetType: instance

  UIListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !GetAtt UILoadBalancer.LoadBalancerArn
      Port: 8000
      Protocol: HTTP
      DefaultActions:
      - Type: forward
        TargetGroupArn: !GetAtt UITargetGroup.TargetGroupArn

  UIECSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn:
    - ECSCluster
    Properties:
      LaunchTemplateData:
        ImageId: !Ref DbECSOptimizedAMI
        NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          DeleteOnTermination: true
          Groups:
          - !Ref SecurityGroup
        InstanceType: !Ref UIECSClusterInstanceType
        IamInstanceProfile:
          Name: !Ref EcsInstanceProfile
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              yum install -y aws-cfn-bootstrap
              /opt/aws/bin/cfn-init -v --region ${AWS::Region} --stack ${AWS::StackName} --resource UIECSLaunchTemplate
              /opt/aws/bin/cfn-signal -e $? --region ${AWS::Region} --stack ${AWS::StackName} --resource UIECSAutoScalingGroup
              exec 2>>/var/log/ecs/ecs-agent-install.log
              set -x
              until curl -s http://localhost:51678/v1/metadata
              do
                sleep 1
              done
              docker plugin install rexray/ebs REXRAY_PREEMPT=true EBS_REGION=${AWS::Region} --grant-all-permissions
              stop ecs
              start ecs

    Metadata:
      AWS::CloudFormation::Init:
        config:
          packages:
            yum:
              aws-cli: []
              jq: []
              ecs-init: []
          commands:
            01_add_instance_to_cluster:
              command: !Sub echo ECS_CLUSTER=${ECSCluster} >> /etc/ecs/ecs.config
            02_start_ecs_agent:
              command: start ecs
          files:
            /etc/cfn/cfn-hup.conf:
              mode: 256
              owner: root
              group: root
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.UIECSLaunchTemplate.Metadata.AWS::CloudFormation::Init
                action=/opt/aws/bin/cfn-init -v --region ${AWS::Region} --stack ${AWS::StackName} --resource UIECSLaunchTemplate
          services:
            sysvinit:
              cfn-hup:
                enabled: 'true'
                ensureRunning: 'true'
                files:
                - /etc/cfn/cfn-hup.conf
                - /etc/cfn/hooks.d/cfn-auto-reloader.conf

  UIECSAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
    - ECSCluster
    Properties:
      MinSize: !Ref ClusterAutoScalingMinSize
      MaxSize: !Ref ClusterAutoScalingMaxSize
      DesiredCapacity: 1
      LaunchTemplate:
        LaunchTemplateId: !Ref UIECSLaunchTemplate
        Version: !GetAtt UIECSLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
      - !Ref PublicSubnet1
      AvailabilityZones:
      - !Select
        - '0'
        - Fn::GetAZs: !Ref AWS::Region
      Tags:
      - Key: Name
        PropagateAtLaunch: true
        Value: !Join
        - ' - '
        - - ECS Instance
          - !Sub ${AWS::StackName}-ui-instance

  UIEC2CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    DependsOn: MyWaitCondition
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref UIECSAutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED

