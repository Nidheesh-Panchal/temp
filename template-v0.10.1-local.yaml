Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DependsOn:
    - EcsInstanceExecutionRole
    - EcsInstanceProfile
    Properties:
      BucketName: !Sub
      - cypienta-${StackSuffix}
      - StackSuffix:
          Fn::Select:
          - 2
          - Fn::Split:
            - /
            - !Ref AWS::StackId

  EcsModelExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: !Sub "${AWS::StackName}-ecsModelPolicy"
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:*
            - states:*
            - logs:*
            - iam:PassRole
            - ecs:*
            Resource: '*'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      - arn:aws:iam::aws:policy/AWSMarketplaceMeteringRegisterUsage

  EcsInstanceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: !Sub "${AWS::StackName}-RexrayPolicy"
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:AttachVolume
            - ec2:CreateVolume
            - ec2:CreateSnapshot
            - ec2:CreateTags
            - ec2:DeleteVolume
            - ec2:DeleteSnapshot
            - ec2:DescribeAvailabilityZones
            - ec2:DescribeInstances
            - ec2:DescribeVolumes
            - ec2:DescribeVolumeAttribute
            - ec2:DescribeVolumeStatus
            - ec2:DescribeSnapshots
            - ec2:CopySnapshot
            - ec2:DescribeSnapshotAttribute
            - ec2:DetachVolume
            - ec2:ModifySnapshotAttribute
            - ec2:ModifyVolumeAttribute
            - ec2:DescribeTag
            Resource: '*'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
      - !Ref EcsInstanceExecutionRole

  # UI ECS
  UITaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
    - UILoadBalancer
    Properties:
      Family: !Sub ui-task-${AWS::StackName}
      Memory: !Ref UITaskMemory
      NetworkMode: host
      RequiresCompatibilities:
      - EC2
      ExecutionRoleArn: !GetAtt EcsModelExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsModelExecutionRole.Arn
      PlacementConstraints:
      - Type: memberOf
        Expression: !Sub
        - attribute:ecs.availability-zone==${AvailabilityZone}
        - AvailabilityZone: !Select
          - '0'
          - Fn::GetAZs: !Ref AWS::Region
      ContainerDefinitions:
      - Name: bastet_db
        Image: postgres:13-bullseye
        Cpu: 0
        PortMappings: []
        Essential: true
        Environment:
        - Name: POSTGRES_USER
          Value: bastet
        - Name: POSTGRES_PASSWORD
          Value: bastet
        - Name: POSTGRES_DB
          Value: bastet
        MountPoints:
        - SourceVolume: !Sub "${AWS::StackName}_ui_postgres_data"
          ContainerPath: /var/lib/postgresql/data/
          ReadOnly: false
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet_redis
        Image: redis:6.2.6-alpine
        Cpu: 0
        PortMappings: []
        Essential: true
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet_rabbitmq
        Image: rabbitmq:alpine
        Cpu: 0
        PortMappings:
        - Name: bastet_rabbitmq-5672-tcp
          ContainerPort: 5672
          HostPort: 5672
          Protocol: tcp
        Essential: true
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet_web
        Image: !FindInMap [Images, WebContainerImage, ImageUri]
        Cpu: 0
        PortMappings:
        - Name: bastet_web-8000-tcp
          ContainerPort: 8000
          HostPort: 8000
          Protocol: tcp
        Essential: true
        Command:
        - ./scripts/entry.sh
        Environment:
        - Name: POSTGRES_USER
          Value: bastet
        - Name: DJANGO_SETTINGS_MODULE
          Value: config.settings.local
        - Name: REDIS_HOST
          Value: localhost
        - Name: DJANGO_SUPERUSER_EMAIL
          Value: !Ref SuperuserEmail
        - Name: POSTGRES_HOST
          Value: localhost
        - Name: DJANGO_SUPERUSER_USERNAME
          Value: !Ref SuperuserUsername
        - Name: POSTGRES_PASSWORD
          Value: bastet
        - Name: POSTGRES_PORT
          Value: '5432'
        - Name: RABBITMQ_HOST
          Value: localhost
        - Name: DJANGO_SUPERUSER_PASSWORD
          Value: !Ref SuperuserPassword
        - Name: POSTGRES_DB_NAME
          Value: bastet
        - Name: AWS_REGION
          Value: !Ref AWS::Region
        - Name: MAX_USER_FIELD_MAPPING
          Value: 20
        - Name: AWS_STORAGE_BUCKET_NAME
          Value: !Ref Bucket
        - Name: GEN_AI_MODEL
          Value: gpt-3.5-turbo
        - Name: AIRFLOW_URL
          Value: !Sub "http://${AirflowLoadBalancer.DNSName}:8080"
        - Name: AIRFLOW_DAG_ID
          Value: file_polling
        - Name: AIRFLOW_USERNAME
          Value: !Ref AirflowUsername
        - Name: AIRFLOW_PASSWORD
          Value: !Ref AirflowPassword
        - Name: OTEL_EXPORTER_OTLP_ENDPOINT
          Value: !FindInMap [UI, OTEL-EXPORTER-OTLP-ENDPOINT, Value]
        MountPoints:
        - SourceVolume: static_volume
          ContainerPath: /code/static
          ReadOnly: false
        - SourceVolume: media_volume
          ContainerPath: /code/media
          ReadOnly: false
        - SourceVolume: config_volume
          ContainerPath: /code/otel_config
          ReadOnly: false
        - SourceVolume: !Sub "${AWS::StackName}_shared_temp"
          ContainerPath: /tmp/shared
          ReadOnly: false
        DependsOn:
        - ContainerName: bastet_db
          Condition: START
        - ContainerName: bastet_redis
          Condition: START
        - ContainerName: bastet_rabbitmq
          Condition: START
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub /ecs/${AWS::StackName}-cluster
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ecs
      - Name: bastet_celery
        Image: !FindInMap [Images, WebContainerImage, ImageUri]
        Cpu: 0
        Essential: true
        Command:
        - celery
        - -A
